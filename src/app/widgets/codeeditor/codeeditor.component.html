<select aria-label="Code language" [(ngModel)]="mode" (change)="changeMode()">
  <option *ngFor="let mode_ of modes" value={{mode_}}>
     {{mode_ | slice:(mode_.indexOf('/') + 1):mode_.length}}
  </option>
</select>

<codemirror id="codemirror" #codeeditor [(ngModel)]="code" [config]="config"></codemirror>

<button type="button" (click)="readCode()">Save code to selected node</button>
<button type="button" (click)="copySource()">Copy source</button>
<span role="status">{{copyStatus}}</span>
